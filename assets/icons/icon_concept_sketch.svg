<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 560" width="1064" height="560">
  <!-- DEADZONE icon concept sketch (P0.3). Original. Two palette variants for the A3.5 test.
       Layout: survivor dead center, horde pressing from every edge, three glowing cards above
       the head, Protocol meter along the bottom. No logo, no text in the icon itself. -->
  <defs>
    <radialGradient id="bgA" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#F2A15A"/><stop offset="0.55" stop-color="#8A3E2A"/><stop offset="1" stop-color="#1B1013"/>
    </radialGradient>
    <radialGradient id="bgB" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#C04AD8"/><stop offset="0.55" stop-color="#3A1650"/><stop offset="1" stop-color="#0D0812"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- one zombie silhouette: hunched, arms forward. Drawn facing right. -->
    <g id="z">
      <path d="M-14 40 L-10 8 L-16 -14 L-6 -30 L8 -30 L14 -16 L40 -18 L42 -10 L14 -6 L36 -2 L36 6 L10 6 L10 40 L2 40 L0 14 L-4 40 Z"/>
      <circle cx="4" cy="-38" r="10"/>
      <circle cx="10" cy="-40" r="2.6" fill="currentColor"/>
    </g>
    <g id="brute">
      <path d="M-30 50 L-28 10 L-40 -6 L-34 -36 L-12 -46 L18 -46 L36 -34 L40 -6 L56 4 L54 22 L30 12 L28 50 L10 50 L6 24 L-6 24 L-10 50 Z"/>
      <circle cx="4" cy="-54" r="9"/>
      <circle cx="9" cy="-55" r="2.4" fill="currentColor"/>
    </g>
    <!-- the survivor: upright, wide stance, weapon raised. Facing viewer-left. -->
    <g id="hero">
      <path d="M-22 70 L-14 20 L-20 -10 L-16 -40 L16 -40 L20 -10 L14 20 L22 70 L10 70 L2 30 L-2 30 L-10 70 Z"/>
      <rect x="-30" y="-36" width="60" height="14" rx="3"/>
      <circle cx="0" cy="-56" r="15"/>
      <rect x="10" y="-30" width="62" height="9" rx="2" transform="rotate(-18 10 -30)"/>
    </g>
    <g id="card">
      <rect x="-26" y="-36" width="52" height="72" rx="8"/>
    </g>
  </defs>

  <style>
    .lbl { font: 600 18px Gotham, 'Segoe UI', Arial, sans-serif; fill: #F2F4F7; }
    .sub { font: 400 14px Gotham, 'Segoe UI', Arial, sans-serif; fill: #9AA3AF; }
  </style>
  <rect width="1064" height="560" fill="#0D0F12"/>

  <!-- ===== Variant A: orange / teal ===== -->
  <g transform="translate(16 16)">
    <rect width="512" height="512" rx="24" fill="url(#bgA)"/>
    <clipPath id="clipA"><rect width="512" height="512" rx="24"/></clipPath>
    <g clip-path="url(#clipA)">
      <!-- horde pressing from the edges, darkest at the rim -->
      <!-- horde eyes take the zone accent via currentColor -->
      <g fill="#1E1A1C" color="#7CFF6B">
        <use href="#z" transform="translate(40 300) scale(1.6)"/>
        <use href="#z" transform="translate(70 420) scale(1.9)"/>
        <use href="#z" transform="translate(20 190) scale(1.3)"/>
        <use href="#brute" transform="translate(70 120) scale(1.2)"/>
        <use href="#z" transform="translate(470 300) scale(-1.6 1.6)"/>
        <use href="#z" transform="translate(440 420) scale(-1.9 1.9)"/>
        <use href="#z" transform="translate(495 190) scale(-1.3 1.3)"/>
        <use href="#brute" transform="translate(445 110) scale(-1.2 1.2)"/>
        <use href="#z" transform="translate(150 470) scale(1.7)"/>
        <use href="#z" transform="translate(360 475) scale(-1.7 1.7)"/>
        <use href="#z" transform="translate(170 60) scale(1.0)"/>
        <use href="#z" transform="translate(340 60) scale(-1.0 1.0)"/>
      </g>
      <!-- survivor: class hue teal, white rim -->
      <g transform="translate(256 300) scale(1.55)">
        <use href="#hero" fill="#0F6E66" stroke="#F2F4F7" stroke-width="3"/>
      </g>
      <!-- three glowing upgrade cards above the head (rare / epic / legendary borders) -->
      <g filter="url(#glow)" stroke-width="5">
        <use href="#card" transform="translate(186 112) rotate(-10)" fill="#15181D" stroke="#3B82F6"/>
        <use href="#card" transform="translate(256 98)" fill="#15181D" stroke="#F59E0B"/>
        <use href="#card" transform="translate(326 112) rotate(10)" fill="#15181D" stroke="#A855F7"/>
      </g>
      <!-- Protocol meter: 7 pips, lit to P5, biohazard-ish marker -->
      <g transform="translate(86 468)">
        <rect x="-8" y="-10" width="356" height="34" rx="17" fill="#0D0F12" opacity="0.85"/>
        <g>
          <rect x="4" y="0" width="40" height="14" rx="7" fill="#46C36A"/>
          <rect x="52" y="0" width="40" height="14" rx="7" fill="#9BD34A"/>
          <rect x="100" y="0" width="40" height="14" rx="7" fill="#E5D23A"/>
          <rect x="148" y="0" width="40" height="14" rx="7" fill="#F5A524"/>
          <rect x="196" y="0" width="40" height="14" rx="7" fill="#FF6A2B"/>
          <rect x="244" y="0" width="40" height="14" rx="7" fill="#3A2A30"/>
          <rect x="292" y="0" width="40" height="14" rx="7" fill="#3A2A30"/>
        </g>
      </g>
    </g>
    <text class="lbl" x="0" y="538">A · orange / teal (Evacuation Streets)</text>
  </g>

  <!-- ===== Variant B: magenta / green ===== -->
  <g transform="translate(536 16)">
    <rect width="512" height="512" rx="24" fill="url(#bgB)"/>
    <clipPath id="clipB"><rect width="512" height="512" rx="24"/></clipPath>
    <g clip-path="url(#clipB)">
      <g fill="#140C1A" color="#FF2BD6">
        <use href="#z" transform="translate(40 300) scale(1.6)"/>
        <use href="#z" transform="translate(70 420) scale(1.9)"/>
        <use href="#z" transform="translate(20 190) scale(1.3)"/>
        <use href="#brute" transform="translate(70 120) scale(1.2)"/>
        <use href="#z" transform="translate(470 300) scale(-1.6 1.6)"/>
        <use href="#z" transform="translate(440 420) scale(-1.9 1.9)"/>
        <use href="#z" transform="translate(495 190) scale(-1.3 1.3)"/>
        <use href="#brute" transform="translate(445 110) scale(-1.2 1.2)"/>
        <use href="#z" transform="translate(150 470) scale(1.7)"/>
        <use href="#z" transform="translate(360 475) scale(-1.7 1.7)"/>
        <use href="#z" transform="translate(170 60) scale(1.0)"/>
        <use href="#z" transform="translate(340 60) scale(-1.0 1.0)"/>
      </g>
      <g transform="translate(256 300) scale(1.55)">
        <use href="#hero" fill="#1F8A3E" stroke="#F2F4F7" stroke-width="3"/>
      </g>
      <g filter="url(#glow)" stroke-width="5">
        <use href="#card" transform="translate(186 112) rotate(-10)" fill="#15181D" stroke="#3B82F6"/>
        <use href="#card" transform="translate(256 98)" fill="#15181D" stroke="#F59E0B"/>
        <use href="#card" transform="translate(326 112) rotate(10)" fill="#15181D" stroke="#A855F7"/>
      </g>
      <g transform="translate(86 468)">
        <rect x="-8" y="-10" width="356" height="34" rx="17" fill="#0D0F12" opacity="0.85"/>
        <rect x="4" y="0" width="40" height="14" rx="7" fill="#46C36A"/>
        <rect x="52" y="0" width="40" height="14" rx="7" fill="#9BD34A"/>
        <rect x="100" y="0" width="40" height="14" rx="7" fill="#E5D23A"/>
        <rect x="148" y="0" width="40" height="14" rx="7" fill="#F5A524"/>
        <rect x="196" y="0" width="40" height="14" rx="7" fill="#FF6A2B"/>
        <rect x="244" y="0" width="40" height="14" rx="7" fill="#E0309A"/>
        <rect x="292" y="0" width="40" height="14" rx="7" fill="#FF2BD6"/>
      </g>
    </g>
    <text class="lbl" x="0" y="538">B · magenta / green (Epicenter, P7)</text>
  </g>
</svg>
